name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.122.0
  DENO_VERSION: v2.x

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  edge-functions:
    name: Edge functions (fmt, lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test:functions

  database:
    name: Database (migrations from scratch, pgTAP, Data API e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Start Supabase (db, auth, rest, storage, kong)
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,realtime,supavisor,postgres-meta,edge-runtime

      - name: Apply all migrations from scratch + seed
        run: supabase db reset

      - name: Lint database (plpgsql_check)
        run: supabase db lint --level error --fail-on error

      - name: pgTAP permission + behaviour tests
        run: supabase test db

      - name: Data API end-to-end tests (PostgREST + GoTrue)
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          deno task test:api

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
